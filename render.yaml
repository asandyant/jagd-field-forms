services:
  - type: web
    name: jagd-field-forms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: jagd-field-forms-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
